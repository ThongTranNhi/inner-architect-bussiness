name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    name: Documentation integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify required project files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            AGENTS.md CLAUDE.md README.md
            docs/01-PRD.md docs/02-SITEMAP.md docs/03-ARCHITECTURE.md
            docs/04-DATABASE.md docs/05-API.md docs/06-DESIGN-SYSTEM.md
            docs/07-UX-UI.md docs/08-SECURITY.md docs/09-TESTING.md
            docs/10-DEPLOYMENT.md docs/11-CHANGELOG.md
            .github/copilot-instructions.md .github/pull_request_template.md
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing or empty: $file"; exit 1; }
          done
      - name: Check whitespace errors
        run: git diff --check HEAD^
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
      - name: Check pull request whitespace errors
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"
        if: github.event_name == 'pull_request'

  # Typecheck, test and build for the website run only in ci-cd.yml
  # ("CI and production deploy"), so they are not duplicated here.
