
name: CI and production deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inner-architect-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          # Public images use Git LFS.
          lfs: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Run lint when configured
        run: |
          if node -e "const s=require('./package.json').scripts || {}; process.exit(s.lint ? 0 : 1)"; then
            pnpm lint
          else
            echo "No lint script configured; skipping."
          fi

      - name: Build production bundle
        env:
          VITE_CONTACT_ZALO_URL: ${{ secrets.VITE_CONTACT_ZALO_URL }}
          VITE_CONTACT_FACEBOOK_URL: ${{ secrets.VITE_CONTACT_FACEBOOK_URL }}
        run: pnpm build

      - name: Package static site
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' ||
           github.event_name == 'workflow_dispatch')
        run: |
          tar \
            --directory=dist \
            --create \
            --gzip \
            --file="inner-architect-${{ github.sha }}.tar.gz" \
            .

      - name: Upload deploy artifact
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' ||
           github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: production-dist
          path: inner-architect-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy to VPS
    needs: verify
    runs-on: ubuntu-latest

    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch')

    environment: production
    timeout-minutes: 15

    steps:
      - name: Check out deployment script
        uses: actions/checkout@v4

      - name: Download verified artifact
        uses: actions/download-artifact@v4
        with:
          name: production-dist
          path: .

      # Validate required deployment configuration.
      - name: Validate deployment configuration
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_ROOT: ${{ secrets.DEPLOY_ROOT }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          for name in \
            DEPLOY_HOST \
            DEPLOY_PORT \
            DEPLOY_USER \
            DEPLOY_ROOT \
            DEPLOY_SSH_PRIVATE_KEY \
            DEPLOY_SSH_KNOWN_HOSTS
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is missing"
              exit 1
            fi
          done

          if ! [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]; then
            echo "::error::DEPLOY_PORT must be numeric"
            exit 1
          fi

          echo "Deployment configuration is present."

      # NEW: Show public IP used by the deployment runner.
      # Compare this IP with incoming packets on the VPS.
      - name: Show GitHub runner public IP
        run: |
          echo "=== GitHub Runner Public IP ==="
          if curl -fsS --max-time 10 https://api.ipify.org; then
            echo
            echo "Runner public IP lookup succeeded."
          else
            echo
            echo "::warning::Could not determine runner public IP."
          fi

      # NEW: Verify the configured host and port
      # without printing secret values.
      - name: Verify expected VPS target
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail

          if [ "$DEPLOY_HOST" != "103.7.41.157" ]; then
            echo "::error::DEPLOY_HOST does not match the expected VPS."
            exit 1
          fi

          if [ "$DEPLOY_PORT" != "22" ]; then
            echo "::error::DEPLOY_PORT does not match SSH port 22."
            exit 1
          fi

          echo "Deployment host and SSH port verified."

      # Check TCP connectivity before attempting SSH.
      - name: Diagnose VPS network connectivity
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail

          echo "Checking GitHub runner outbound SSH..."

          python3 - <<'PY'
          import os
          import socket
          import sys

          host = os.environ["DEPLOY_HOST"]
          port = int(os.environ["DEPLOY_PORT"])

          try:
              with socket.create_connection(
                  (host, port),
                  timeout=12
              ):
                  print("SUCCESS: VPS SSH port is reachable.")
          except (OSError, ValueError) as error:
              print(
                  "ERROR: SSH connection failed: "
                  f"{type(error).__name__}",
                  file=sys.stderr,
              )
              print(
                  "Check DEPLOY_HOST, DEPLOY_PORT, "
                  "provider firewall, network ACL "
                  "and SSH access rules.",
                  file=sys.stderr,
              )
              sys.exit(1)
          PY

      - name: Configure SSH trust
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          install -d -m 700 ~/.ssh

          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" \
            > ~/.ssh/id_ed25519

          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" \
            > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/known_hosts

          ssh-keygen -y -f ~/.ssh/id_ed25519 \
            > /dev/null

          echo "SSH private key format is valid."

      - name: Test SSH authentication
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail

          ssh \
            -p "$DEPLOY_PORT" \
            -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=12 \
            -o ConnectionAttempts=1 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "echo 'SSH authentication successful'"

      - name: Upload release archive
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail

          ARCHIVE="inner-architect-${{ github.sha }}.tar.gz"

          test -f "$ARCHIVE"

          scp \
            -P "$DEPLOY_PORT" \
            -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=12 \
            -o ConnectionAttempts=1 \
            "$ARCHIVE" \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/$ARCHIVE"

          echo "Release archive uploaded."

      - name: Atomically activate release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_ROOT: ${{ secrets.DEPLOY_ROOT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail

          ssh \
            -p "$DEPLOY_PORT" \
            -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=12 \
            -o ConnectionAttempts=1 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -s -- '$DEPLOY_ROOT' '${{ github.sha }}' '/tmp/inner-architect-${{ github.sha }}.tar.gz'" \
            < scripts/deploy/activate-release.sh

          echo "Release activation command completed."

      - name: Deployment summary
        if: success()
        run: |
          echo "## INNER ARCHITECT Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: main" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release activation: successful" >> "$GITHUB_STEP_SUMMARY"
          echo "- Verify production content separately." >> "$GITHUB_STEP_SUMMARY"
